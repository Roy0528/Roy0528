<svg xmlns="http://www.w3.org/2000/svg" width="850" height="170" viewBox="0 0 850 170" role="img" aria-label="Contribution Streak">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, "Cascadia Code", Consolas, "Liberation Mono", monospace; font-variant-numeric: tabular-nums; }
    .prompt { font-size: 13px; fill: #59636e; }
    .label { font-size: 14px; fill: #1f2328; }
    .value { font-size: 14px; font-weight: 700; fill: #1f2328; }
    .small { font-size: 13px; fill: #1f2328; }
    .muted { font-size: 12px; fill: #59636e; }
    .big { font-size: 38px; font-weight: 700; fill: #1f2328; }
    .accent { fill: #1a7f37; }
    .fire { fill: #bc4c00; }
    .chevron { fill: none; stroke: #1a7f37; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .leader { stroke: #59636e; stroke-opacity: 0.45; stroke-width: 1.5; stroke-dasharray: 0 6; stroke-linecap: round; }
    .divider { stroke: #d1d9e0; }
    /* fill-mode both：延遲期間保持隱藏，不支援動畫的環境則直接顯示 */
    .fade { animation: fade 0.5s ease-out both; }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .fade { animation: none; } }
  </style>
  <rect x="0.5" y="0.5" width="849" height="169" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
  <path class="chevron" d="M24 27.5l5 4.5-5 4.5"/>
  <text x="38" y="37" class="prompt">git streak</text>
  <line x1="283.5" y1="58" x2="283.5" y2="148" class="divider"/>
  <line x1="567.5" y1="58" x2="567.5" y2="148" class="divider"/>
  <g class="fade" style="animation-delay:0.10s" text-anchor="middle"><text x="142" y="98" class="big">353</text><text x="142" y="124" class="small">total contributions</text><text x="142" y="146" class="muted">Mar 3, 2021 – present</text></g>
  <g class="fade" style="animation-delay:0.25s" text-anchor="middle"><text x="425" y="98" class="big fire">4</text><text x="425" y="124" class="small fire">current streak</text><text x="425" y="146" class="muted">Oct 27 – Oct 30</text></g>
  <g class="fade" style="animation-delay:0.40s" text-anchor="middle"><text x="708" y="98" class="big">5</text><text x="708" y="124" class="small">longest streak</text><text x="708" y="146" class="muted">May 11 – May 15</text></g>
</svg>
