<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">RoyWu</title>
  <desc id="desc">Master's in I/O Psychology · National Taiwan University · Based in Taiwan. Stack: Python, C#, JavaScript, .NET, Vue, MySQL, PostgreSQL, Git</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, "Cascadia Code", Consolas, "Liberation Mono", monospace; }
    .cmd   { font-size: 22px; fill: #e6edf3; }
    .name  { font-size: 56px; font-weight: 700; fill: #e6edf3; }
    .sub   { font-size: 20px; fill: #8b98a5; }
    .stack { font-size: 20px; fill: #79c0ff; }
    .chev  { fill: none; stroke: #3fb950; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    /* fill-mode both：延遲期間停在第一格（隱藏），不支援動畫的環境則直接顯示完整內容 */
    .out   { animation: show 0.01s linear both; }
    .typed { animation: type 0.5s steps(6) both; }
    .cursor { animation: show 0.01s linear 2.6s both, blink 1.1s steps(1) 2.6s infinite; }
    @keyframes show  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes type  { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .out, .typed, .cursor { animation: none; } }
  </style>

  <rect x="0.5" y="0.5" width="1199" height="339" rx="14" fill="#0b0f14" stroke="#262f3a"/>
  <path d="M14 0.5H1186A13.5 13.5 0 0 1 1199.5 14V44H0.5V14A13.5 13.5 0 0 1 14 0.5Z" fill="#121821"/>
  <line x1="0" y1="44.5" x2="1200" y2="44.5" stroke="#262f3a"/>
  <circle cx="30" cy="22" r="6.5" fill="#ff5f57"/>
  <circle cx="52" cy="22" r="6.5" fill="#febc2e"/>
  <circle cx="74" cy="22" r="6.5" fill="#28c840"/>
  <text x="600" y="27" text-anchor="middle" font-size="14" fill="#8b98a5">roy@ntu: ~</text>

  <!-- 指令逐字打出，輸出整行出現，最後停在閃爍游標 -->
  <path class="chev out" style="animation-delay:0.2s" d="M50 79l7 6.5-7 6.5"/>
  <text class="cmd typed" style="animation-delay:0.35s" x="72" y="94">whoami</text>
  <text class="name out" style="animation-delay:1s" x="46" y="152">RoyWu</text>
  <text class="sub out" style="animation-delay:1.15s" x="48" y="190">Master's in I/O Psychology · National Taiwan University · Taiwan</text>

  <path class="chev out" style="animation-delay:1.5s" d="M50 229l7 6.5-7 6.5"/>
  <text class="cmd typed" style="animation-delay:1.65s; animation-timing-function:steps(10)" x="72" y="244">ls ~/stack</text>
  <text class="stack out" style="animation-delay:2.3s" x="48" y="278" xml:space="preserve">python  csharp  javascript  dotnet  vue  mysql  postgres  git</text>

  <g class="out" style="animation-delay:2.6s">
    <path class="chev" d="M50 303l7 6.5-7 6.5"/>
  </g>
  <rect class="cursor" x="72" y="300" width="12" height="22" fill="#e6edf3"/>
</svg>
